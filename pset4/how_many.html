<!DOCTYPE html>

<body>

    <canvas width="600" height="600" id="canvas" style="width: 600px; height: 600px;"></canvas>

</body>

<script>

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const w = canvas.width, h = canvas.height;

    const dpr = window.devicePixelRatio || 1;
    canvas.width *= dpr, canvas.height *= dpr;
    ctx.scale(dpr, dpr);

    let numCircles = prompt ("How many circles?");

    const maxRadius = w * 0.45;
    const radiusIncr = maxRadius / numCircles
    
    const colors = [

    "#EF998D",
    "#F0AA75",
    "#EEBB61",
    "#E8776B",
    "#E678B2",
    "#C184D1",
    "#77B1B6",
    "#65D0A0",
    "#66D69E"

    ];

    for (let i = 0; i < numCircles; i++) {

    let radius = radiusIncr * (i + 1);

    ctx.beginPath();

    ctx.arc(

        w / 2,
        h / 2,
        radius,
        0,
        Math.PI * 2,
        true

    );

    ctx.strokeStyle = colors [i];
    ctx.lineWidth = 3;
    ctx.stroke();
}

</script>
